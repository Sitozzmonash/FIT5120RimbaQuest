services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////app/data/RimbaQuest.db
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes: ["rimbaquest-data:/app/data"]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on: [backend]
volumes:
  rimbaquest-data:
