services:
  - type: web
    name: rimbaquest-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/RimbaQuest.db
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ZHIPU_API_KEY
        sync: false
    disk:
      name: rimbaquest-data
      mountPath: /app/data
      sizeGB: 1
  - type: web
    name: rimbaquest-web
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
