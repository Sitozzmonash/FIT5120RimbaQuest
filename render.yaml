services:
  - type: web
    name: rimbaquest-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: DATABASE_STORAGE_BUCKET
        value: image
      # Epic 6: stored only in Render, never in the Expo client or git.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_CHAT_MODEL
        value: deepseek-chat
      # Public GBIF taxonomy lookup only; other external sources are reviewed
      # evidence records rather than runtime web scraping.
      - key: GBIF_API_ENABLED
        value: "true"
      - key: ZHIPU_API_KEY
        sync: false
      - key: ZHIPU_VISION_MODEL
        value: glm-4.6v-flash
