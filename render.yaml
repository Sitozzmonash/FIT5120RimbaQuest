services:
  - type: web
    name: rimbaquest-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/RimbaQuest.db
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ZHIPU_API_KEY
        sync: false
    disk:
      name: rimbaquest-sqlite-data
      mountPath: /var/data
      sizeGB: 1
